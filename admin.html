<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffc81e">

  <title>Panel de invitados</title>

  <link rel="stylesheet" href="css/estilos.css">

  <style>
    /* ===== Panel administrativo ===== */

    .admin-top {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
      background: var(--amarillo);
      border-bottom: 2px solid var(--negro);
      box-shadow: 0 4px 14px rgba(20, 20, 20, 0.15);
    }

    .admin-top h1 {
      font-family: var(--fuente-titulo);
      font-size: 20px;
    }

    .btn-mini {
      width: auto;
      min-height: 40px;
      padding: 8px 16px;
      font-size: 15px;
    }

    .contenedor {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 50px;
    }

    .error {
      color: #b00020;
      font-weight: 600;
      text-align: center;
    }

    /* ----- Resumen ----- */

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .dato {
      padding: 14px 12px;
      background: var(--blanco);
      border: 2px solid var(--negro);
      border-radius: 16px;
      box-shadow: 4px 4px 0 var(--negro);
      text-align: center;
    }

    .dato strong {
      display: block;
      font-size: 32px;
      line-height: 1.1;
    }

    .dato span {
      font-size: 13px;
      font-weight: 600;
      color: var(--gris);
    }

    .dato.grande {
      grid-column: 1 / -1;
      background: var(--amarillo);
    }

    .dato.grande span {
      color: var(--negro);
    }

    .desglose {
      margin-bottom: 18px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: var(--gris);
    }

    /* ----- Filtros ----- */

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .chip {
      padding: 9px 14px;
      border: 2px solid var(--negro);
      border-radius: 999px;
      background: var(--blanco);
      color: var(--negro);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip[aria-pressed="true"] {
      background: var(--negro);
      color: var(--amarillo);
    }

    .nota {
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--gris);
    }

    .buscador {
      width: 100%;
      min-height: 50px;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 2px solid var(--negro);
      border-radius: 14px;
      background: var(--blanco);
      font-family: inherit;
      font-size: 16px;
    }

    .buscador:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--amarillo);
    }

    .barra-lista {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    /* ----- Lista ----- */

    .invitado {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
      padding: 14px;
      background: var(--blanco);
      border: 2px solid var(--negro);
      border-radius: 16px;
    }

    .invitado.no {
      border-style: dashed;
      opacity: 0.8;
    }

    .invitado .fila {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .invitado .nombre {
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .badge {
      flex-shrink: 0;
      padding: 4px 12px;
      border: 2px solid var(--negro);
      border-radius: 999px;
      background: var(--amarillo);
      font-size: 13px;
      font-weight: 700;
    }

    .invitado.no .badge {
      background: var(--blanco);
    }

    .invitado .personas {
      font-weight: 600;
    }

    .invitado .mensaje {
      padding: 8px 12px;
      border-left: 4px solid var(--amarillo);
      background: var(--crema);
      border-radius: 8px;
      font-style: italic;
      overflow-wrap: anywhere;
    }

    .invitado .fecha {
      font-size: 12px;
      color: var(--gris);
    }

    .vacio {
      padding: 30px 10px;
      text-align: center;
      color: var(--gris);
    }
  </style>
</head>

<body>

  <header class="admin-top">
    <h1>📋 Panel de invitados</h1>
    <button type="button" class="btn btn-negro btn-mini" id="btnSalir" hidden>Salir</button>
  </header>


  <main class="contenedor">

    <!-- =========================
         INICIO DE SESIÓN
         ========================= -->

    <section id="login">
      <div class="tarjeta">

        <h2>Acceso administrador</h2>

        <form class="formulario" id="formLogin" novalidate>

          <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" autocomplete="username" inputmode="email">
          </div>

          <div class="campo">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" autocomplete="current-password">
          </div>

          <button type="submit" class="btn btn-negro" id="btnEntrar">Entrar</button>

          <p class="error" id="errorLogin" hidden></p>

        </form>

      </div>
    </section>


    <!-- =========================
         PANEL
         ========================= -->

    <section id="panel" hidden>

      <div class="resumen">

        <div class="dato grande">
          <strong id="totPersonas">0</strong>
          <span>Personas confirmadas en total</span>
        </div>

        <div class="dato">
          <strong id="totFamilias">0</strong>
          <span>Familias que confirmaron</span>
        </div>

        <div class="dato">
          <strong id="totNo">0</strong>
          <span>Familias que no asistirán</span>
        </div>

        <div class="dato">
          <strong id="totCumple">0</strong>
          <span>🎂 Personas al cumpleaños</span>
        </div>

        <div class="dato">
          <strong id="totBautizo">0</strong>
          <span>🕊️ Personas al bautizo</span>
        </div>

      </div>

      <p class="desglose" id="desglose"></p>


      <div class="chips" id="chips">
        <button type="button" class="chip" data-filtro="todos" aria-pressed="true">Todos</button>
        <button type="button" class="chip" data-filtro="cumple" aria-pressed="false">🎂 Cumpleaños</button>
        <button type="button" class="chip" data-filtro="bautizo" aria-pressed="false">🕊️ Bautizo</button>
        <button type="button" class="chip" data-filtro="ambas" aria-pressed="false">Ambas</button>
        <button type="button" class="chip" data-filtro="no" aria-pressed="false">No asisten</button>
      </div>

      <p class="nota">"Cumpleaños" y "Bautizo" incluyen también a quienes van a ambas celebraciones.</p>

      <input type="search" class="buscador" id="buscador" placeholder="Buscar por nombre o mensaje">

      <div class="barra-lista">
        <span id="contador"></span>
        <button type="button" class="btn btn-amarillo btn-mini" id="btnActualizar">↻ Actualizar</button>
      </div>

      <p class="nota" id="ultimaActualizacion"></p>

      <div id="lista"></div>

    </section>

  </main>

  <script type="module" src="js/admin.js"></script>

</body>

</html>
