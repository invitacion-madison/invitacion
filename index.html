<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffc81e">

  <title>Invitación de Cumpleaños</title>

  <link rel="stylesheet" href="css/estilos.css">
</head>

<body data-pagina="cumpleanos">

  <!-- =========================
       MÚSICA DE FONDO
       ========================= -->

  <audio id="musica" loop preload="auto">
    <source src="img/cancion.mp3" type="audio/mpeg">
  </audio>


  <!-- =========================
       MENÚ SUPERIOR (fijo)
       ========================= -->

  <header class="menu">
    <nav aria-label="Navegación principal">
      <a href="index.html" class="activo" aria-current="page">
        <img src="img/pastel.png" alt="" width="20">
       Cumpleaños
      </a>
      <img src="img/encentro.png" alt="" class="menu-centro">
      <a href="bautizo.html">
        <img src="img/mano.gif" alt="" width="20">
         Ver Bautizo
        <img src="img/bau-removebg-preview.png" alt="" width="20">
      </a>
    </nav>
  </header>


  <main>

    <!-- =========================
         VIDEO DE INVITACIÓN (solo cumpleaños)
         Sin sonido. Inicia al aceptar el mensaje inicial.
         ========================= -->

    <section class="hero">
      <p class="etiqueta">Invitación de cumpleaños</p>

      <div class="marco marco-video">
        <video
          id="videoInvitacion"
          poster="img/1114-Cover.jpg"
          muted
          playsinline
          preload="auto"
          disablepictureinpicture
          disableremoteplayback
        >
          <source src="https://res.cloudinary.com/tlnugcr7/video/upload/v1794714668/1114.mp4" type="video/mp4">
        </video>

        <!-- Portada: aparece cuando termina el video y se queda fija -->
        <div class="portada" id="portadaCumple" hidden>
          <img src="img/1114(2)-Cover.jpg" alt="Portada de la invitación de cumpleaños" onerror="this.remove()">
        </div>

        <p class="aviso-medio" id="avisoMedio" hidden>El video de la invitación estará disponible muy pronto.</p>
      </div>

      <button type="button" class="btn btn-negro btn-repetir" id="btnRepetir" hidden>
        ↻ Ver video de nuevo
      </button>
    </section>

    <!-- =========================
         UBICACIÓN
         ========================= -->

    <section class="seccion" id="ubicacion">
      <div class="tarjeta">
        <h2>
          <img src="img/ubi2.gif" alt="Ubicación" width="30">
          Ubicación
        </h2>
        <a
          class="btn btn-negro"
          href="https://www.google.com/maps/place/Salon+Las+Palmas/@22.004307,-98.9972427,18z/data=!4m14!1m7!3m6!1s0x85d612b7848dfab9:0xe8631be5e6b5f373!2sIglesia+San+Judas+Tadeo!8m2!3d22.0024328!4d-98.9931517!16s%2Fg%2F11c47t64t6!3m5!1s0x85d612ba254b8433:0x731ec45788b91fff!8m2!3d22.0049826!4d-98.9969957!16s%2Fg%2F11bxdt4j5w?hl=es&entry=ttu&g_ep=EgoyMDI2MTExOC4xIKXMDSoASAFQAw%3D%3D"
          target="_blank"
          rel="noopener"
        >Ver ubicación de la fiesta</a>
      </div>
    </section>


    <!-- =========================
         CONFIRMACIÓN DE ASISTENCIA
         (mismo formulario en ambas páginas)
         ========================= -->

    <section class="seccion" id="confirmacion">
      <div class="tarjeta">

        <h2>¿Nos acompañas?</h2>

        <div class="acciones" id="accionesIniciales">
          <button type="button" class="btn btn-amarillo" id="btnSi">Sí asistiré 💛</button>
          <button type="button" class="btn btn-linea" id="btnNo">No podré asistir</button>
        </div>

        <form class="formulario" id="formulario" hidden novalidate>

          <div class="campo">
            <label for="nombre">Nombre de la familia</label>
            <input type="text" id="nombre" placeholder="Ej. Familia Pérez" maxlength="100" autocomplete="name">
          </div>

          <div class="campo">
            <label for="personas">¿Cuántos asistirán?</label>
            <input type="number" id="personas" placeholder="Número de personas" min="1" inputmode="numeric">
          </div>

          <div class="campo">
            <label for="evento">¿A qué celebración nos acompañarás?</label>
            <select id="evento">
              <option value="Ambas celebraciones">Ambas celebraciones</option>
              <option value="Cumpleaños">Cumpleaños</option>
              <option value="Bautizo">Bautizo</option>
            </select>
          </div>

          <div class="campo">
            <label for="mensaje">Déjanos un mensaje 💛 <span class="opcional">(opcional)</span></label>
            <textarea id="mensaje" placeholder="Escribe aquí tu mensaje" maxlength="500"></textarea>
          </div>

          <button type="submit" class="btn btn-negro" id="btnConfirmar">Confirmar asistencia</button>
          <button type="button" class="btn btn-linea" id="btnCancelar">Cancelar</button>

        </form>

        <div class="estado" id="estadoConfirmacion"></div>

      </div>
    </section>

  </main>


  <!-- =========================
       MENSAJES EMERGENTES
       ========================= -->

  <div id="popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitulo" hidden>
    <div class="popup-caja">
      <img src="img/abeja.gif" alt="" onerror="this.remove()">
      <h3 id="popupTitulo"></h3>
      <p id="popupTexto"></p>
      <button type="button" class="btn btn-negro" id="btnCerrarPopup">Aceptar</button>
    </div>
  </div>


  <!-- FIREBASE + CONFIRMACIONES + MÚSICA + VIDEO -->
  <script type="module" src="js/invitacion.js"></script>

</body>

</html>
